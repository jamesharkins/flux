name: Deploy to GitHub Pages
on:
  push:
    tags:
      - "web-v*"
    branches:
      # Preview deploys for the Kelp Digital colour work.
      - "claude/magical-euler-55bln8"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30

      - name: Build app
        run: nix build .#web

      - name: Prepare site
        run: |
          cp -rL result ./_site
          chmod -R u+w ./_site
          # Production deploys (web-v* tags) keep the custom domain.
          # Branch and manual preview deploys drop it so the site is
          # reachable at <user>.github.io/<repo>/.
          if [ "${{ startsWith(github.ref, 'refs/tags/web-v') }}" != "true" ]; then
            rm -f ./_site/CNAME
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
